name: System quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python tools/check_repository_secrets.py
      - run: docker build -f prophitbet-saas/backend/Dockerfile -t prophitbet-test .
      - name: Backend regression tests with coverage
        run: |
          mkdir -p reports
          docker run --rm \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$PWD/reports,target=/reports" \
            -w /workspace \
            -e PYTHONPATH=/workspace/prophitbet-saas:/workspace \
            -e ML_CORE_PATH=/workspace/src \
            -e COVERAGE_FILE=/reports/.coverage \
            prophitbet-test sh -c 'pip install --quiet coverage==7.10.7 && python -m coverage run -m unittest discover -s prophitbet-saas/backend/tests -q && python -m coverage xml'
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: reports/backend-coverage.xml
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prophitbet-saas/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node tests/league-filter.cjs && node tests/prediction-groups.cjs
      - run: npx tsc --noEmit
      - run: npm run build
  jev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code-jev-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test -- --maxWorkers=1
      - run: node --test scripts/checker-validation.test.mjs
      - run: npx tsc --noEmit
